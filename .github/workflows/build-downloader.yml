name: Build MultiDownloader

on:
  push:
    branches: ["**"]
    paths:
      - "downloader/**"
      - ".github/workflows/build-downloader.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish MultiDownloader
        shell: pwsh
        run: downloader/build/publish-app.ps1

      - name: Upload MultiDownloader.exe
        uses: actions/upload-artifact@v4
        with:
          name: MultiDownloader
          path: downloader/src/MultiDownloader.App/bin/Release/net8.0-windows/win-x64/publish/MultiDownloader.exe
          if-no-files-found: error
